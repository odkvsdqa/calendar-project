# Server Configuration
server.port=8080
server.servlet.context-path=/calendar-web
server.address=0.0.0.0

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/calendar_db?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
spring.datasource.username=calendar_user
spring.datasource.password=calendar_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# JWT Configuration
jwt.secret=your-very-secret-key-for-jwt-token-generation-should-be-long-and-secure
jwt.expiration=86400000

# Default Admin Configuration (\u9996\u6B21\u555F\u52D5\u6642\u6703\u81EA\u52D5\u5275\u5EFA)
# \u53EF\u4EE5\u5728\u8CC7\u6599\u5EAB\u4E2D\u624B\u52D5\u5C07\u73FE\u6709\u7528\u6236\u7684 role \u6539\u70BA ADMIN
# \u6216\u5728\u8A3B\u518A\u6642\u4F7F\u7528\u7279\u5B9A\u9080\u8ACB\u78BC\u8A3B\u518A\u70BA\u7BA1\u7406\u54E1

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.calendar=DEBUG
logging.level.org.springframework.security=DEBUG