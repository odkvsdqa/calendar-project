
server.port=8080
server.servlet.context-path=/calendar-web
server.address=0.0.0.0


spring.datasource.url=jdbc:mysql://localhost:3306/calendar_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=calendar_user
spring.datasource.password=calendar_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

jwt.secret=your-very-secret-key-for-jwt-token-generation-should-be-long-and-secure
jwt.expiration=86400000


logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.calendar=DEBUG
logging.level.org.springframework.security=DEBUG

# 
app.exchange-rate.api-url=https://api.exchangerate-api.com/v4/latest/USD
app.exchange-rate.cron=0 0 2 * * *


app.crawler.fixed-rate=10800000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


